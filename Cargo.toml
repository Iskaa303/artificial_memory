[package]
name = "ouroboros"
version = "0.0.1"
edition = "2024"
authors = ["Iskander 'Iskaa303' Madikhan"]
license = "MIT"
readme = "README.md"

[dependencies]
log = "0.4.29"
env_logger = "0.11.10"
dotenvy = "0.15.7"
eyre = "0.6.12"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.51.1", features = ["full"] }
similar = "3.0.0"
chrono = "0.4.44"
indicatif = { version = "0.18.4", features = ["rayon"] }
walkdir = "2.5.0"
wasmtime = "43.0.1"
wat = "1.246.2"
toml = "1.1.2"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json"] }
zip = "8.5.1"
